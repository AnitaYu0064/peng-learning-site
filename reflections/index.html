<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>議題思辨與學習心得</title>
  <style>
    :root{
      --bg:#f7f8fa;
      --card:#ffffff;
      --text:#111827;
      --sub:#374151;
      --line:#e2e8f0;
      --accent:#1d4ed8;
      --soft:#eff6ff;
      --accent2:#1a2744;
      --header-bg:#1a2744;
      --shadow:0 2px 8px rgba(0,0,0,.04), 0 6px 20px rgba(26,39,68,.06);
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",sans-serif;
      background:var(--bg);
      color:var(--text);
      line-height:1.9;
      font-size:18px;
    }
    .site-header{
      background:var(--header-bg);
      padding:14px 24px;
      box-shadow:0 2px 14px rgba(26,39,68,.22);
    }
    .site-header-inner{
      max-width:1120px;
      margin:0 auto;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      flex-wrap:wrap;
    }
    .site-header-label{
      color:rgba(255,255,255,.65);
      font-size:13px;
      font-weight:700;
      letter-spacing:.4px;
    }
    .page-nav{
      display:flex;
      gap:10px;
      align-items:center;
      flex-wrap:wrap;
      margin-bottom:22px;
      padding-top:4px;
    }
    .nav-btn{
      display:inline-flex;
      align-items:center;
      gap:7px;
      text-decoration:none;
      background:var(--accent);
      color:#fff !important;
      padding:10px 18px;
      border-radius:10px;
      font-size:15px;
      font-weight:700;
      box-shadow:0 3px 10px rgba(29,78,216,.2);
      transition:background .18s,transform .15s;
    }
    .nav-btn:hover{
      background:#1e3a8a;
      transform:translateY(-1px);
    }
    .wrap{
      max-width:980px;
      margin:0 auto;
      padding:24px 20px 72px;
    }
    .hero{
      background:#ffffff;
      border:1px solid var(--line);
      border-left:5px solid var(--accent2);
      border-radius:0 14px 14px 0;
      padding:28px 30px 24px;
      box-shadow:0 2px 8px rgba(0,0,0,.04),0 4px 16px rgba(26,39,68,.05);
      margin-bottom:22px;
    }
    .eyebrow{
      display:inline-block;
      padding:4px 10px;
      border-radius:4px;
      background:var(--accent2);
      color:#fff;
      font-size:11px;
      font-weight:700;
      margin-bottom:14px;
      letter-spacing:1px;
      text-transform:uppercase;
    }
    h1{
      margin:0 0 10px;
      font-size:38px;
      line-height:1.2;
      letter-spacing:-.02em;
      color:var(--accent2);
    }
    .lead{
      margin:0;
      font-size:19px;
      color:var(--sub);
      max-width:920px;
    }

    /* 部落格式文章列表 */
    .article-list{
      display:grid;
      grid-template-columns:1fr;
      gap:18px;
    }
    .article-card{
      background:var(--card);
      border:1px solid var(--line);
      border-left:4px solid var(--accent);
      border-radius:0 12px 12px 0;
      padding:24px 26px;
      box-shadow:0 2px 8px rgba(0,0,0,.04);
      transition:box-shadow .18s,transform .15s;
    }
    .article-card:hover{
      box-shadow:0 10px 28px rgba(26,39,68,.10);
      transform:translateY(-1px);
    }
    .article-topline{
      display:flex;
      align-items:center;
      justify-content:space-between;
      flex-wrap:wrap;
      gap:8px 12px;
      margin-bottom:8px;
    }
    .article-date{
      color:#64748b;
      font-size:13px;
      font-weight:700;
      letter-spacing:.2px;
    }
    .article-status{
      display:inline-block;
      padding:3px 9px;
      border-radius:999px;
      background:var(--soft);
      color:var(--accent);
      font-size:12px;
      font-weight:800;
    }
    .article-card h2{
      margin:0 0 10px;
      font-size:27px;
      line-height:1.4;
      color:var(--accent2);
    }
    .article-card h2 a{
      color:inherit;
      text-decoration:none;
    }
    .article-card h2 a:hover{
      color:var(--accent);
    }
    .article-tags{
      display:flex;
      flex-wrap:wrap;
      gap:7px;
      margin-bottom:13px;
    }
    .tag{
      display:inline-block;
      padding:3px 9px;
      border-radius:5px;
      background:#f1f5f9;
      color:#475569;
      font-size:12px;
      font-weight:700;
    }
    .article-card p{
      margin:0 0 18px;
      color:var(--sub);
      font-size:17px;
    }
    .mini-btn{
      display:inline-flex;
      align-items:center;
      gap:6px;
      text-decoration:none;
      background:var(--accent);
      color:#fff;
      padding:10px 16px;
      border-radius:10px;
      font-size:15px;
      font-weight:800;
      box-shadow:0 3px 10px rgba(29,78,216,.2);
      transition:background .18s,transform .15s;
    }
    .mini-btn:hover{
      background:#1e3a8a;
      transform:translateY(-1px);
    }
    .empty-state{
      background:#fff;
      border:1px solid var(--line);
      border-radius:12px;
      padding:24px;
      color:#64748b;
    }
    .footer{
      margin-top:24px;
      text-align:center;
      color:#6b7280;
      font-size:14px;
    }
    @media (max-width:700px){
      body{font-size:17px}
      .wrap{padding:18px 14px 52px}
      h1{font-size:30px}
      .lead,.article-card p{font-size:16px}
      .article-card h2{font-size:23px}
      .article-card{padding:21px 20px}
    }
  </style>
</head>
<body>
  <div class="site-header">
    <div class="site-header-inner">
      <span class="site-header-label">彭頌哲自學歷程記錄網站</span>
    </div>
  </div>

  <div class="wrap">
    <div class="page-nav">
      <a class="nav-btn" href="../index.html">← 返回首頁</a>
    </div>

    <div class="hero">
      <div class="eyebrow">主題頁｜閱讀反思｜辯論輸出｜觀點整理</div>
      <h1>議題思辨與學習心得</h1>
      <p class="lead">
        這一頁整理頌哲針對不同書籍、觀點與議題的討論內容。文章依日期由新到舊排列，
        呈現他如何從閱讀、提問、對話與多次修訂中，逐步形成自己的理解與判斷。
      </p>
    </div>

    <main id="article-list" class="article-list" aria-live="polite"></main>

    <div id="article-count" class="footer"></div>
  </div>

  <script src="articles.js"></script>
  <script>
    (function () {
      const articleList = document.getElementById("article-list");
      const articleCount = document.getElementById("article-count");

      if (!Array.isArray(window.REFLECTION_ARTICLES)) {
        articleList.innerHTML =
          '<div class="empty-state">文章資料目前無法載入，請確認 articles.js 已放在 reflections 資料夾中。</div>';
        return;
      }

      const articles = window.REFLECTION_ARTICLES
        .map((article, index) => ({ ...article, _originalIndex: index }))
        .sort((a, b) => {
          const aTime = a.date ? Date.parse(a.date + "T00:00:00") : NaN;
          const bTime = b.date ? Date.parse(b.date + "T00:00:00") : NaN;

          if (!Number.isNaN(aTime) && !Number.isNaN(bTime)) {
            return bTime - aTime;
          }
          if (!Number.isNaN(aTime)) return -1;
          if (!Number.isNaN(bTime)) return 1;

          return a._originalIndex - b._originalIndex;
        });

      function formatDate(dateString) {
        if (!dateString) return "尚未填寫日期";

        const date = new Date(dateString + "T00:00:00");
        if (Number.isNaN(date.getTime())) return "日期格式有誤";

        return new Intl.DateTimeFormat("zh-TW", {
          year: "numeric",
          month: "long",
          day: "numeric"
        }).format(date);
      }

      articleList.innerHTML = articles.map((article) => {
        const tags = Array.isArray(article.tags)
          ? article.tags.map((tag) => `<span class="tag">${tag}</span>`).join("")
          : "";

        return `
          <article class="article-card">
            <div class="article-topline">
              <time class="article-date" datetime="${article.date || ""}">
                ${formatDate(article.date)}
              </time>
              ${article.status ? `<span class="article-status">${article.status}</span>` : ""}
            </div>

            <h2>
              <a href="${article.url}">${article.title}</a>
            </h2>

            <div class="article-tags">${tags}</div>

            <p>${article.description}</p>

            <a class="mini-btn" href="${article.url}">進入閱讀 →</a>
          </article>
        `;
      }).join("");

      articleCount.textContent =
        `本頁目前收錄 ${articles.length} 篇議題思辨與學習心得，依發表日期由新到舊排列。`;
    })();
  </script>
</body>
</html>
